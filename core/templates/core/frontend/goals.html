{% extends "core/frontend/base.html" %}

{% block page_title %}Goals{% endblock %}

{% block page_content %}
<section class="mb-8 flex flex-wrap items-end justify-between gap-4">
    <div>
        <p class="text-sm font-semibold text-indigo-600">MAKE ROOM FOR WHAT MATTERS</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">Savings goals</h1>
        <p class="mt-2 text-slate-500">Give your plans a name and a number.</p>
    </div>
    <button class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700" type="button" data-open-dialog="goal-dialog">+ Create goal</button>
</section>
<section id="goal-grid" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
    <p class="panel text-sm text-slate-500">Loading goals…</p>
</section>
<dialog id="goal-dialog" class="w-[min(32rem,calc(100%-2rem))] rounded-2xl p-0 shadow-2xl backdrop:bg-slate-950/40">
    <form method="dialog" class="flex items-center justify-between border-b border-slate-100 px-6 py-5">
        <h2 class="text-lg font-bold">Create a savings goal</h2>
        <button class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-100" aria-label="Close dialog">✕</button>
    </form>
    <form id="goal-form" class="space-y-4 p-6">
        {% csrf_token %}
        <label class="block text-sm font-semibold text-slate-700">Goal name
            <input class="form-input mt-2" name="title" maxlength="255" placeholder="e.g. Emergency fund" required>
        </label>
        <label class="block text-sm font-semibold text-slate-700">Target amount
            <input class="form-input mt-2" name="target_amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
        <label class="block text-sm font-semibold text-slate-700">Already saved <span class="font-normal text-slate-400">Optional</span>
            <input class="form-input mt-2" name="current_amount" type="number" min="0" step="0.01" value="0.00">
        </label>
        <label class="block text-sm font-semibold text-slate-700">Target date <span class="font-normal text-slate-400">Optional</span>
            <input class="form-input mt-2" name="deadline" type="date">
        </label>
        <div class="flex justify-end gap-3 pt-2">
            <button class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700" type="button" data-close-dialog="goal-dialog">Cancel</button>
            <button class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700" type="submit">Save goal</button>
        </div>
    </form>
</dialog>
{% endblock %}
