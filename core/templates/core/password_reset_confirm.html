<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password | Balance</title>
  </head>
  <body>
    <main>
      <h1>Choose a new password</h1>
      <form id="password-reset-form">
        <label for="new-password1">New password</label>
        <input
          id="new-password1"
          name="new_password1"
          type="password"
          autocomplete="new-password"
          required
        >
        <label for="new-password2">Confirm new password</label>
        <input
          id="new-password2"
          name="new_password2"
          type="password"
          autocomplete="new-password"
          required
        >
        <button type="submit">Reset password</button>
      </form>
      <p id="reset-status" role="status"></p>
    </main>
    <script>
      const uid = "{{ uid|escapejs }}";
      const token = "{{ token|escapejs }}";
      const form = document.getElementById("password-reset-form");
      const status = document.getElementById("reset-status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const values = new FormData(form);
        const button = form.querySelector("button");
        button.disabled = true;
        status.textContent = "Updating your password...";

        try {
          const response = await fetch(window.location.pathname, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              uid,
              token,
              new_password1: values.get("new_password1"),
              new_password2: values.get("new_password2"),
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            const errors = Object.values(result).flat().join(" ");
            throw new Error(errors || "Password reset failed.");
          }
          status.textContent = "Your password has been reset. You can now log in.";
          form.hidden = true;
        } catch (error) {
          status.textContent = error.message || "Password reset failed. Please try again.";
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
